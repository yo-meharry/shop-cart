<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Cart</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <nav class="navbar">
            <button class="menu-toggle" id="menu-toggle">&#9776;</button>
            <h1 class="logo">My Shopping Cart</h1>
            <button class="cart-toggle" id="cart-toggle">
                &#128722;
                <span id="cart-badge" class="cart-count">0</span>
            </button>
        </nav>
    </header>
    <aside class="menu-sidebar" id="menuSidebar">
        <div class="menu-header">
            <h2>Categories</h2>
        </div>
        <div class="menu-categories" id="menuCategories"></div>
    </aside>
    <div class="menu-overlay" id="menuOverlay"></div>
    <main id="productGrid" class="product-grid"></main>

    <div id="pagination" class="pagination">
        <button id="prevBtn">Previous</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextBtn">Next</button>
    </div>

    <aside id="cartPanel" class="cart-panel">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button id="closeCart">✕</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
            <p>Total: <b id="cartTotal">$0</b></p>
        </div>
    </aside>
    <div id="cartOverlay" class="cart-overlay"></div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
